<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WaoSim Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #1e3a8a);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.chat-header {
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
  color: white;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
}

.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* MESSAGE */
.message-wrapper {
  display: flex;
  flex-direction: column;
  margin-bottom: 10px;
}

.message {
  max-width: fit-content;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
}

.user-wrapper { align-items: flex-end; }

.user {
  background: #2563eb;
  color: white;
}

.bot-wrapper { align-items: flex-start; }

.bot {
  background: #1e293b;
  color: #e2e8f0;
}

.bot p { margin: 4px 0; }
.bot ul { margin: 4px 0; padding-left: 18px; }
.bot li { margin-bottom: 2px; }

.avatar {
  font-size: 14px;
  margin-bottom: 2px;
}

.timestamp {
  font-size: 11px;
  color: #ffffff;
  margin-top: 4px;
}

/* INPUT */
.input-container {
  display: flex;
  padding: 12px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  margin-left: 10px;
  padding: 12px 18px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* TYPING */
.typing-dots {
  display: flex;
  gap: 4px;
}
.typing-dots span {
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  animation: blink 1.4s infinite;
}
@keyframes blink {
  0%,80%,100%{opacity:0;}
  40%{opacity:1;}
}
</style>
</head>

<body>

<div class="chat-header">🌍 WaoSim Assistant</div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <input id="userInput" placeholder="Ask about eSIM..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

/* CLEAN TEXT */
function cleanText(text) {
  return text
    .replace(/\r/g, "")
    .replace(/^[A-Z][^\n]*\?\s*$/gm, "")
    .replace(/^(What|When|Can|How|Why|Is|Do)[^\n]*\?\s*$/gim, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* TIME */
function getTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* SCROLL FIX */
function scrollToBottom() {
  const chatBox = document.getElementById("chatBox");
  chatBox.scrollTo({
    top: chatBox.scrollHeight,
    behavior: "smooth"
  });
}

/* MESSAGE */
function createMessage(content, type) {
  return `
  <div class="message-wrapper ${type}-wrapper">
    <div class="avatar">${type === "user" ? "🧑" : "🤖"}</div>
    <div class="message ${type}">${content}</div>
    <div class="timestamp">${getTime()}</div>
  </div>`;
}

/* TYPING */
function typingBubble(id) {
  return `
  <div id="${id}" class="message-wrapper bot-wrapper">
    <div class="avatar">🤖</div>
    <div class="message bot">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>`;
}

/* SEND */
async function sendMessage() {
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if (!msg) return;

  const chatBox = document.getElementById("chatBox");

  chatBox.insertAdjacentHTML("beforeend", createMessage(msg, "user"));
  input.value = "";
  scrollToBottom();

  const id = "t-" + Date.now();
  chatBox.insertAdjacentHTML("beforeend", typingBubble(id));
  scrollToBottom();

  try {
    const res = await fetch(webhookURL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:msg})
    });

    const data = await res.json();
    document.getElementById(id).remove();

    const reply = cleanText(data.output || data.text || "⚠️ Error");

    chatBox.insertAdjacentHTML(
      "beforeend",
      createMessage(marked.parse(reply), "bot")
    );

    requestAnimationFrame(() => {
      scrollToBottom();
    });

  } catch {
    document.getElementById(id).remove();
    chatBox.insertAdjacentHTML(
      "beforeend",
      createMessage("⚠️ Connection issue", "bot")
    );
    scrollToBottom();
  }
}

/* ENTER KEY */
document.getElementById("userInput").addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
