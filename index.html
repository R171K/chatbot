<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WaoSim Support Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #1e293b;
      color: white;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 12px;
      max-width: 60%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #1e293b;
      color: #e2e8f0;
      margin-right: auto;
    }

    .input-container {
      display: flex;
      padding: 15px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      background: #22c55e;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .bot strong {
      color: #facc15;
    }

    /* 🔥 CLEAN SPACING CONTROL */
    .bot p {
      margin: 4px 0;
    }

    .bot ul {
      margin: 4px 0;
      padding-left: 18px;
    }

    .bot li {
      margin-bottom: 3px;
    }

    .bot br {
      display: none; /* removes extra visual breaks */
    }
  </style>
</head>

<body>

  <div class="chat-header">
    🌍 WaoSim Support Assistant
  </div>

  <div class="chat-container">
    <div id="chatBox" class="chat-box"></div>

    <div class="input-container">
      <input id="userInput" placeholder="Ask about eSIM, plans, activation..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

/* 🔥 FINAL CLEANING FUNCTION */
function cleanText(text) {
  return text
    .replace(/\r/g, "")

    // remove empty lines
    .replace(/^\s*$/gm, "")

    // collapse big gaps
    .replace(/\n{3,}/g, "\n\n")

    // fix broken sentences
    .replace(/([^\n])\n([^\n])/g, "$1 $2")

    // keep intentional spacing
    .replace(/\n\s*\n/g, "\n\n")

    .trim();
}

/* 🔥 AUTO SCROLL (STRONG VERSION) */
function scrollToBottom() {
  const chatBox = document.getElementById("chatBox");
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");

  const message = input.value.trim();
  if (!message) return;

  chatBox.innerHTML += `<div class="message user">${message}</div>`;
  input.value = "";
  scrollToBottom();

  const typingId = "typing-" + Date.now();
  chatBox.innerHTML += `<div id="${typingId}" class="message bot">Typing...</div>`;
  scrollToBottom();

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    const response = await fetch(webhookURL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ chatInput: message }),
      signal: controller.signal
    });

    clearTimeout(timeout);

    const data = await response.json();

    document.getElementById(typingId).remove();

    const botReply =
      data.output ||
      data.response ||
      data.text ||
      "⚠️ Sorry, I couldn’t find that information.";

    const cleaned = cleanText(botReply);
    const formatted = marked.parse(cleaned);

    chatBox.innerHTML += `<div class="message bot">${formatted}</div>`;

    // 🔥 DOUBLE ENSURE SCROLL
    scrollToBottom();
    setTimeout(scrollToBottom, 50);
    setTimeout(scrollToBottom, 150);

  } catch (error) {
    document.getElementById(typingId).remove();

    chatBox.innerHTML += `
      <div class="message bot">
        ⚠️ Connection issue. Please try again.
      </div>
    `;

    scrollToBottom();
  }
}

document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
