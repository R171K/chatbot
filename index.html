<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radhe Shyam — Shop by Category (3D Bento)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset & Tokens ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #EC9B13;
      --gold-soft:  #F5B93A;
      --gold-deep:  #C8780A;
      --orange:     #F26B21;
      --ink:        #241608;
      --cream:      #FBF4EA;
      --white:      #FFFFFF;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 12% -5%, #FFF1DA 0%, transparent 55%),
        radial-gradient(1000px 620px at 100% 110%, #FDE7D2 0%, transparent 55%),
        linear-gradient(180deg, #FDF7EF 0%, #F7EEE1 100%);
    }

    /* ─── Announcement + Header ────────────────────────────── */
    .announcement {
      background: #141414; color: #E7C98C;
      font-size: .7rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; text-align: center;
      padding: .42rem 1rem; display: flex; justify-content: center;
      gap: 2.5rem; flex-wrap: wrap;
    }
    .announcement span { display: flex; align-items: center; gap: .4rem; }

    .site-header {
      background: var(--orange);
      padding: .6rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 16px rgba(242,107,33,.32);
    }
    .nav-left { display: flex; align-items: center; gap: 1.8rem; }
    .nav-link {
      color: var(--white); text-decoration: none;
      font-size: .86rem; font-weight: 700; letter-spacing: .02em; transition: opacity .2s;
    }
    .nav-link:hover { opacity: .8; }
    .nav-link.dropdown::after { content: ' ⌄'; font-size: .75rem; }
    .logo-wrap { position: absolute; left: 50%; transform: translateX(-50%); }
    .logo-fallback {
      height: 46px; width: 46px; border-radius: 50%;
      background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.5);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: 1rem; color: var(--white); letter-spacing: .03em;
    }
    .nav-right { display: flex; align-items: center; gap: .9rem; }
    .search-bar {
      background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.4);
      border-radius: 50px; padding: .38rem 1.1rem; color: var(--white);
      font-family: 'Nunito', sans-serif; font-size: .8rem; width: 180px; outline: none;
    }
    .search-bar::placeholder { color: rgba(255,255,255,.75); }
    .nav-icon {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.18); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--white); font-size: 1rem;
    }

    /* ─── Section (compact so everything fits one screen) ──── */
    .page { max-width: 1180px; margin: 0 auto; padding: 1.9rem 1.4rem 2rem; }
    .section-head { text-align: center; margin-bottom: 1.5rem; }
    .section-eyebrow {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .7rem; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: var(--gold-deep); margin-bottom: .35rem;
    }
    .section-eyebrow::before, .section-eyebrow::after {
      content: ''; width: 24px; height: 1.5px; background: var(--gold);
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-weight: 700;
      color: var(--ink); line-height: 1.12; letter-spacing: -.01em;
    }
    .section-title em { font-style: italic; color: var(--orange); }

    /* ─── 3D Bento Grid ────────────────────────────────────── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 200px;
      gap: 15px;
      perspective: 1700px;          /* real depth for the 3D tilt */
    }
    .span2 { grid-column: span 2; }

    /* ─── Card = full-bleed image tile ─────────────────────── */
    .cat-card {
      position: relative;
      display: block;
      border-radius: 20px;
      text-decoration: none;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.22,1,.36,1),
                  box-shadow .5s cubic-bezier(.22,1,.36,1);
      box-shadow: 0 12px 26px rgba(90,54,8,.16), 0 3px 8px rgba(90,54,8,.10);
      will-change: transform;
    }
    .cat-card:hover {
      transform: rotateX(7deg) rotateY(-6deg) translateY(-5px);
      box-shadow: 0 34px 56px rgba(90,54,8,.28), 0 10px 20px rgba(90,54,8,.16);
      z-index: 5;
    }

    /* image wrapper clips the zoom to rounded corners */
    .cat-imgwrap {
      position: absolute; inset: 0;
      border-radius: 20px; overflow: hidden;
      transform: translateZ(0);
    }
    .cat-imgwrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .6s cubic-bezier(.22,1,.36,1);
    }
    .cat-card:hover .cat-imgwrap img { transform: scale(1.08); }
    /* readability veil at the bottom for the label */
    .cat-imgwrap::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(20,12,2,.28) 100%);
    }

    /* ─── Floating white label (name + arrow) ──────────────── */
    .cat-label {
      position: absolute; left: 14px; bottom: 14px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(4px);
      border-radius: 13px;
      padding: .55rem .8rem .6rem;
      display: flex; flex-direction: column; gap: .18rem;
      min-width: 116px;
      box-shadow: 0 8px 18px rgba(20,12,2,.22);
      transform: translateZ(48px);        /* pops above the photo in 3D */
      transition: transform .5s cubic-bezier(.22,1,.36,1), background .3s;
    }
    .cat-card:hover .cat-label {
      transform: translateZ(80px) translateY(-2px);
    }
    .cat-arrow {
      align-self: flex-start;
      width: 22px; height: 22px; border-radius: 7px;
      background: var(--ink); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem; line-height: 1;
      transition: background .3s, transform .3s;
    }
    .cat-card:hover .cat-arrow {
      background: var(--gold-deep); transform: translate(2px,-2px) rotate(0deg);
    }
    .cat-name {
      font-size: .96rem; font-weight: 900; color: var(--ink);
      line-height: 1.1; letter-spacing: -.01em;
    }
    .cat-name small {
      display: block; font-size: .96rem; font-weight: 900;   /* second line, same weight */
    }

    /* ─── View All ─────────────────────────────────────────── */
    .footer-strip { text-align: center; margin-top: 1.5rem; }
    .btn-all {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .7rem 1.9rem; border-radius: 50px;
      background: var(--ink); color: var(--white);
      font-size: .82rem; font-weight: 700; letter-spacing: .04em;
      text-decoration: none; text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(36,22,8,.22);
      transition: background .25s, transform .25s;
    }
    .btn-all:hover { background: var(--gold-deep); transform: translateY(-2px); }
    .btn-all::after { content: '→'; }

    /* ─── Responsive ───────────────────────────────────────── */
    @media (max-width: 820px) {
      .cat-grid { grid-auto-rows: 165px; gap: 12px; }
      .logo-wrap { position: static; transform: none; }
      .site-header { justify-content: center; flex-wrap: wrap; gap: .6rem; }
    }
    @media (max-width: 540px) {
      .cat-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; gap: 10px; }
      .span2 { grid-column: span 2; }         /* wide tiles fill the row on mobile */
      .page { padding: 1.4rem .9rem 1.6rem; }
      .cat-name, .cat-name small { font-size: .82rem; }
      .cat-label { min-width: 0; padding: .45rem .6rem .5rem; }
    }
  </style>
</head>
<body>

  <div class="announcement">
    <span>⭐ Trusted by Thousands of Families</span>
    <span>🏆 Premium Quality Steelware</span>
    <span>📞 +91 90818 15180</span>
  </div>

  <header class="site-header">
    <nav class="nav-left">
      <a href="#" class="nav-link dropdown">All Categories</a>
      <a href="#" class="nav-link">Contact Us</a>
      <a href="#" class="nav-link">Orders</a>
    </nav>
    <div class="logo-wrap"><div class="logo-fallback">RS</div></div>
    <div class="nav-right">
      <input class="search-bar" type="text" placeholder="Search products…" />
      <button class="nav-icon" title="Account">👤</button>
      <button class="nav-icon" title="Cart">🛒</button>
    </div>
  </header>

  <main class="page">

    <div class="section-head">
      <div class="section-eyebrow">Our Collections</div>
      <h2 class="section-title">Shop by <em>Category</em></h2>
    </div>

    <div class="cat-grid">

      <!-- Row 1 -->
      <!-- 1. Cookware (wide) -->
      <a href="#" class="cat-card span2" aria-label="Shop Cookware">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/cookware7/800/500" alt="Cookware" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Cookware</span>
        </div>
      </a>

      <!-- 2. Metalware -->
      <a href="#" class="cat-card" aria-label="Shop Metalware">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/metalware3/500/500" alt="Metalware" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Metalware</span>
        </div>
      </a>

      <!-- 3. Kitchen Storage -->
      <a href="#" class="cat-card" aria-label="Shop Kitchen Storage">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/storage9/500/500" alt="Kitchen Storage" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Kitchen<small>Storage</small></span>
        </div>
      </a>

      <!-- Row 2 -->
      <!-- 4. Crockery -->
      <a href="#" class="cat-card" aria-label="Shop Crockery">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/crockery5/500/500" alt="Crockery" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Crockery</span>
        </div>
      </a>

      <!-- 5. Home Appliances -->
      <a href="#" class="cat-card" aria-label="Shop Home Appliances">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/appliance2/500/500" alt="Home Appliances" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Home<small>Appliances</small></span>
        </div>
      </a>

      <!-- 6. Pooja Essentials (wide) -->
      <a href="#" class="cat-card span2" aria-label="Shop Pooja Essentials">
        <div class="cat-imgwrap">
          <img src="https://picsum.photos/seed/pooja8/800/500" alt="Pooja Essentials" loading="lazy" />
        </div>
        <div class="cat-label">
          <span class="cat-arrow">↗</span>
          <span class="cat-name">Pooja<small>Essentials</small></span>
        </div>
      </a>

    </div><!-- /cat-grid -->

    <div class="footer-strip">
      <a href="#" class="btn-all">View All Categories</a>
    </div>

  </main>

</body>
</html>
