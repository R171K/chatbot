<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WaoSim Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
  margin: 0;
  font-family: "Inter", Arial, sans-serif;
  background: #0f172a;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.chat-header {
  background: linear-gradient(90deg, #1e293b, #0f172a);
  color: white;
  padding: 18px;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* CHAT AREA */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  scroll-behavior: smooth;
}

/* MESSAGE BASE */
.message {
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: fit-content;
  max-width: 75%;
  animation: fadeIn 0.25s ease;
}

/* USER MESSAGE */
.user {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

/* BOT MESSAGE */
.bot {
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(8px);
  color: #e2e8f0;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}

/* TYPING */
.typing {
  opacity: 0.7;
  font-style: italic;
}

/* INPUT AREA */
.input-container {
  display: flex;
  padding: 12px;
  background: #1e293b;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px 14px;
  border-radius: 999px;
  border: none;
  outline: none;
  font-size: 14px;
  background: #0f172a;
  color: white;
}

button {
  padding: 12px 18px;
  border: none;
  background: #22c55e;
  color: white;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #16a34a;
}

/* MARKDOWN CLEAN */
.bot p {
  margin: 4px 0;
}

.bot ul {
  margin: 6px 0;
  padding-left: 18px;
}

.bot li {
  margin-bottom: 4px;
}

/* ANIMATION */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* SCROLLBAR */
.chat-box::-webkit-scrollbar {
  width: 6px;
}
.chat-box::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="chat-header">
  🌍 WaoSim Support Assistant
</div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <input id="userInput" placeholder="Ask about eSIM, plans, activation..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

/* CLEAN TEXT */
function cleanText(text) {
  return text
    .replace(/\r/g, "")
    .replace(/^[A-Z][^\n]*\?\s*$/gm, "")
    .replace(/^(What|When|Can|How|Why|Is|Do|Does|Will)[^\n]*\?\s*$/gim, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* AUTO SCROLL (STRONG FIX) */
function scrollToBottom(force = false) {
  const chatBox = document.getElementById("chatBox");

  requestAnimationFrame(() => {
    chatBox.scrollTo({
      top: chatBox.scrollHeight,
      behavior: force ? "auto" : "smooth"
    });
  });
}

/* SEND MESSAGE */
async function sendMessage() {
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");

  const message = input.value.trim();
  if (!message) return;

  chatBox.innerHTML += `<div class="message user">${message}</div>`;
  input.value = "";

  scrollToBottom(true);

  const typingId = "typing-" + Date.now();
  chatBox.innerHTML += `<div id="${typingId}" class="message bot typing">Typing...</div>`;
  scrollToBottom();

  try {
    const response = await fetch(webhookURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chatInput: message })
    });

    const data = await response.json();

    document.getElementById(typingId).remove();

    const botReply =
      data.output ||
      data.response ||
      data.text ||
      "⚠️ Sorry, I couldn’t find that information.";

    const cleaned = cleanText(botReply);
    const formatted = marked.parse(cleaned);

    chatBox.innerHTML += `<div class="message bot">${formatted}</div>`;

    // MULTI-STEP SCROLL FIX
    scrollToBottom();
    setTimeout(() => scrollToBottom(), 100);
    setTimeout(() => scrollToBottom(true), 300);

  } catch (error) {
    document.getElementById(typingId).remove();

    chatBox.innerHTML += `
      <div class="message bot">
        ⚠️ Connection issue. Please try again.
      </div>
    `;

    scrollToBottom();
  }
}

/* ENTER KEY */
document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
