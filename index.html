<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WaoSim Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* 🌌 BACKGROUND */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;

  background: linear-gradient(-45deg,#020617,#0f172a,#1e293b,#1e3a8a);
  background-size: 300% 300%;
  animation: gradientBG 18s ease-in-out infinite;
}

@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(59,130,246,0.1), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(99,102,241,0.1), transparent 40%);
  pointer-events:none;
}

/* HEADER */
.chat-header {
  background: rgba(30,41,59,0.75);
  backdrop-filter: blur(10px);
  color:white;
  padding:12px;
  font-size:16px;
  font-weight:600;
}

/* CHAT */
.chat-container {
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.chat-box {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE WRAPPER */
.message-wrapper {
  display:flex;
  flex-direction:column;
  margin-bottom:6px;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(5px);}
  to {opacity:1;}
}

/* MESSAGE */
.message {
  display:inline-block;
  max-width:75%;
  padding:8px 10px;
  border-radius:14px;
  line-height:1.35;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

/* REMOVE MARKDOWN EXTRA SPACE */
.bot p { margin:2px 0; }
.bot ul { margin:2px 0; padding-left:14px; }
.bot li { margin:1px 0; }

/* USER */
.user-wrapper { align-items:flex-end; }
.user {
  background:#2563eb;
  color:white;
}

/* BOT */
.bot-wrapper { align-items:flex-start; }
.bot {
  background:rgba(30,41,59,0.9);
  color:#e2e8f0;
}

/* AVATAR */
.avatar {
  font-size:12px;
  margin-bottom:2px;
}

/* TIMESTAMP */
.timestamp {
  font-size:10px;
  color:#94a3b8;
  margin-top:2px;
}

/* INPUT */
.input-container {
  display:flex;
  padding:8px;
  background:rgba(30,41,59,0.8);
}

textarea {
  flex:1;
  padding:8px;
  border-radius:10px;
  border:none;
  resize:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:white;
}

button {
  margin-left:6px;
  padding:8px 12px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:disabled {
  opacity:0.5;
}
</style>
</head>

<body>

<div class="chat-header">🌍 WaoSim Assistant</div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <textarea id="userInput" rows="1" placeholder="Ask about eSIM..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

/* CLEAN TEXT */
function cleanText(text){
  return text
    .replace(/\r/g,"")
    .replace(/^[A-Z][^\n]*\?\s*$/gm,"")
    .replace(/^(What|When|Can|How|Why|Is|Do)[^\n]*\?\s*$/gim,"")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

/* TIME */
function getTime(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

/* MESSAGE (FIXED — NO DUPLICATE DIV BUG) */
function createMessage(content,type){
  return `
  <div class="message-wrapper ${type}-wrapper">
    <div class="avatar">${type==="user"?"🧑":"🤖"}</div>
    <div class="message ${type}">
      ${content}
    </div>
    <div class="timestamp">${getTime()}</div>
  </div>`;
}

/* AUTO SCROLL — RELIABLE VERSION */
const chatBox = document.getElementById("chatBox");

function scrollToBottom(){
  requestAnimationFrame(()=>{
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

/* SEND */
async function sendMessage(){
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if(!msg) return;

  chatBox.insertAdjacentHTML("beforeend", createMessage(msg,"user"));
  input.value="";
  scrollToBottom();

  const id="t-"+Date.now();
  chatBox.insertAdjacentHTML("beforeend",`
  <div id="${id}" class="message-wrapper bot-wrapper">
    <div class="avatar">🤖</div>
    <div class="message bot">Typing...</div>
  </div>`);
  scrollToBottom();

  try{
    const res=await fetch(webhookURL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:msg})
    });

    const data=await res.json();
    document.getElementById(id).remove();

    const reply=cleanText(data.output||data.text||"⚠️ Error");

    chatBox.insertAdjacentHTML(
      "beforeend",
      createMessage(marked.parse(reply),"bot")
    );

    scrollToBottom();

  }catch{
    document.getElementById(id).remove();
    chatBox.insertAdjacentHTML(
      "beforeend",
      createMessage("⚠️ Connection issue","bot")
    );

    scrollToBottom();
  }
}

/* ENTER */
document.getElementById("userInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
