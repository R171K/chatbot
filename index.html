<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Reels Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }

    /* ── Carousel section ── */
    .reels-section {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .reels-section h2 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .reels-section > p { color: #666; font-size: 14px; margin-bottom: 24px; }

    .reels-track-wrapper { position: relative; }
    .reels-track {
      display: flex; gap: 16px;
      overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 16px; scrollbar-width: none;
    }
    .reels-track::-webkit-scrollbar { display: none; }

    /* ── Carousel card ── */
    .reel-card {
      flex: 0 0 300px; scroll-snap-align: start;
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      display: flex; flex-direction: column;
      cursor: pointer;
    }
    .reel-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.18); }

    .reel-clip {
      width: 300px; height: 360px;
      overflow: hidden; position: relative; flex-shrink: 0;
    }
    .reel-clip iframe {
      width: 300px; height: 750px;
      margin-top: -58px;
      border: none; display: block;
      pointer-events: none; /* card click opens fullscreen, not iframe */
    }

    /* Click-to-open overlay on card */
    .reel-tap-overlay {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
    }
    .reel-tap-overlay .play-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
    }
    .reel-tap-overlay .play-icon svg { fill: #fff; width: 24px; height: 24px; margin-left: 4px; }
    .reel-clip:hover .play-icon { opacity: 1; }

    .reel-product {
      padding: 12px 14px; display: flex; align-items: center; gap: 10px;
      border-top: 1px solid #f0f0f0;
    }
    .reel-product img {
      width: 44px; height: 44px; border-radius: 8px;
      object-fit: cover; background: #e8e8e8; flex-shrink: 0;
    }
    .reel-product-info { flex: 1; min-width: 0; }
    .reel-product-name {
      font-size: 13px; font-weight: 600; color: #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reel-product-price { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .price-current  { font-size: 14px; font-weight: 700; color: #e53935; }
    .price-original { font-size: 12px; color: #999; text-decoration: line-through; }
    .reel-add-btn {
      background: #1a1a1a; color: #fff; border: none; border-radius: 8px;
      padding: 8px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background 0.2s;
    }
    .reel-add-btn:hover { background: #e53935; }

    .nav-btn {
      position: absolute; top: 215px; z-index: 10;
      background: #fff; border: none; border-radius: 50%;
      width: 40px; height: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: box-shadow 0.2s;
    }
    .nav-btn:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.24); }
    .nav-btn.prev { left: -20px; }
    .nav-btn.next { right: -20px; }

    /* ══════════════════════════════════════
       FULLSCREEN REEL VIEWER
    ══════════════════════════════════════ */
    #fs-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: #000;
      display: none; flex-direction: column;
      touch-action: none;
    }
    #fs-overlay.open { display: flex; }

    /* Close button and counter sit on the frame (inside #fs-clip-wrapper) */
    #fs-close {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(0,0,0,0.45); border: none; color: #fff;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #fs-close:hover { background: rgba(255,255,255,0.2); }
    #fs-counter {
      position: absolute; top: 14px; right: 12px; z-index: 20;
      color: #fff; font-size: 11px; font-weight: 600;
      background: rgba(0,0,0,0.4); border-radius: 20px;
      padding: 3px 9px; pointer-events: none;
    }
    /* Gradient on the clip itself — makes close/counter legible over any video */
    #fs-clip::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      z-index: 19; pointer-events: none;
    }

    /* Two drag strips — top 35% and bottom 35% of the clip.
       The centre 30% is intentionally left uncovered so the iframe's play button
       receives clicks directly (1-click play, no overlay in the way). */
    #fs-drag-top,
    #fs-drag-bottom {
      position: absolute;
      left: 0; right: 0;
      z-index: 3;
      cursor: grab;
    }
    #fs-drag-top:active,
    #fs-drag-bottom:active { cursor: grabbing; }
    #fs-drag-top    { top: 0;    height: 35%; }
    #fs-drag-bottom { bottom: 0; height: 35%; }
    /* Centre 30% (35 – 65%): no overlay → iframe play button is 1-click */

    /* Video area — stretches wrapper to fill all available height */
    #fs-video-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      /* align-items defaults to stretch — wrapper fills full height automatically */
      justify-content: center;
    }

    /* Wrapper stretches to the full video-area height; width is capped by the
       Instagram reel aspect ratio (4:5 = height/1.25) so it stays proportional
       on wide desktops while filling edge-to-edge on narrow mobile screens.     */
    #fs-clip-wrapper {
      position: relative;
      align-self: stretch;          /* fill full video-area height */
      display: flex;
      flex-direction: column;       /* makes #fs-clip fill wrapper with flex:1 */
      width: 100%;
      max-width: calc((100vh - 72px) / 1.25);
    }

    /* Clip fills its wrapper completely */
    #fs-clip {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* iframe COVERS the clip; extra height lets overflow:hidden eat footer.

       Width is driven from the available HEIGHT (not the clip width) so the reel's
       ~4:5 media is always tall enough to fill the video-area: media height =
       iframe_width × 1.25 = (100vh − 72). On a tall/narrow phone this width exceeds
       the clip, so the iframe is centred and #fs-clip's overflow:hidden crops the
       sides (pillar/chrome, not the subject). On desktop the clip already equals
       this width, so max(100%,…) = 100% and nothing changes. This is what removes
       the mobile black band — previously the iframe was width:100%, so on a narrow
       screen the media was only (screen-width × 1.25) tall, far short of the area. */
    #fs-clip iframe {
      position: absolute;
      width: max(100%, calc((100vh - 72px) / 1.25));
      height: calc(100% + 58px + 220px); /* +58 header clip, +220 footer margin */
      top: -58px;
      left: 50%;
      transform: translateX(-50%);       /* centre the (possibly over-wide) iframe */
      border: none;
      transition: opacity 0.25s;
      z-index: 1;
    }

    /* Footer cover hides Instagram's action bar just below the media. The media now
       always fills to the clip bottom (see iframe rule), so the bar is pushed below
       the clip and clipped by overflow — the cover only needs a thin safety strip.
       (The old height formula assumed media height = screen-width × 1.25; on mobile
       that ballooned to ~150–320px and WAS the visible black band.)               */
    #fs-footer-cover {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 30px;
      background: #000;
      z-index: 5;
    }
    #fs-header-cover {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: #000;
      z-index: 5;
    }

    /* Swipe hint label — shown briefly; reels are switched by swiping up/down */
    #fs-swipe-hint {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 600;
      white-space: nowrap; pointer-events: none;
      z-index: 15;
      background: rgba(0,0,0,0.4);
      padding: 5px 12px; border-radius: 16px;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      transition: opacity 0.5s;
    }
    #fs-swipe-hint.hide { opacity: 0; }

    /* Product card at bottom of fullscreen */
    #fs-product {
      flex-shrink: 0;
      background: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      min-height: 72px;
    }
    #fs-product img {
      width: 48px; height: 48px; border-radius: 10px;
      object-fit: cover; background: #e8e8e8; flex-shrink: 0;
    }
    #fs-product-info { flex: 1; min-width: 0; }
    #fs-product-name {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #fs-product-price { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    #fs-price-current  { font-size: 15px; font-weight: 700; color: #e53935; }
    #fs-price-original { font-size: 13px; color: #999; text-decoration: line-through; }
    #fs-add-btn {
      background: #1a1a1a; color: #fff; border: none; border-radius: 10px;
      padding: 10px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background 0.2s;
    }
    #fs-add-btn:hover { background: #e53935; }

    /* Loading spinner shown during iframe swap */
    #fs-spinner {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); display: none;
    }
    #fs-spinner.show { display: flex; }
    .spinner-ring {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .reel-card { flex: 0 0 260px; }
      .reel-clip { width: 260px; height: 310px; }
      .reel-clip iframe { width: 260px; height: 700px; }
      .nav-btn { display: none; }              /* carousel arrows on the home strip */
    }
  </style>
</head>
<body>

<!-- ── Carousel ── -->
<div class="reels-section">
  <h2>Shop Our Reels</h2>

      <!-- Reel 3 -->
      <div class="reel-card" onclick="openFullscreen(3)">

<!-- ══════════════════════════════════════
     FULLSCREEN VIEWER
══════════════════════════════════════ -->
<div id="fs-overlay">

  <!-- Video area -->
  <div id="fs-video-area">

    <!-- Wrapper: relative container so nav buttons anchor to the clip frame -->
    <div id="fs-clip-wrapper">

      <div id="fs-clip">
        <iframe id="fs-iframe" src=""
          scrolling="no" allowtransparency="true"
          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
        </iframe>
        <!-- Top drag strip (top 35%) — grab cursor, intercepts drag from top of video -->
        <div id="fs-drag-top"></div>
        <!-- Bottom drag strip (bottom 35%) — grab cursor, intercepts drag from bottom -->
        <div id="fs-drag-bottom"></div>
        <!-- Centre 30% is uncovered: iframe play button is directly clickable (1-click) -->
        <!-- Covers Instagram footer: "View more", likes, comments, icons -->
        <div id="fs-footer-cover"></div>
        <!-- Covers any logo/branding at top edge -->
        <div id="fs-header-cover"></div>
        <!-- Close and counter live INSIDE #fs-clip so they are always on the video frame -->
        <button id="fs-close" onclick="closeFullscreen()">✕</button>
        <span id="fs-counter">1 / 4</span>
        <!-- Reels are switched by swiping up/down — this hint fades out after first swipe -->
        <div id="fs-swipe-hint">↑ Swipe to switch reels ↓</div>
      </div>

    </div>

    <!-- Loading spinner -->
    <div id="fs-spinner"><div class="spinner-ring"></div></div>
  </div>

  <!-- Product card -->
  <div id="fs-product">
    <img id="fs-product-img" src="" alt="" onerror="this.style.background='#e8e8e8'" />
    <div id="fs-product-info">
      <div id="fs-product-name"></div>
      <div id="fs-product-price">
        <span id="fs-price-current"></span>
        <span id="fs-price-original"></span>
      </div>
    </div>
    <button id="fs-add-btn">Add to Cart</button>
  </div>

</div>

<script>
  /* ── Reel data ── */
  const REELS = [
    { src: 'https://www.instagram.com/reel/DaAObOdNkta/embed/', name: 'Vacuum Bottle',      price: '₹599', original: '₹899' },
    { src: 'https://www.instagram.com/reel/DZ6_TpnN-Ey/embed/',  name: 'Sidha Patra',        price: '₹120', original: '₹180' },
    { src: 'https://www.instagram.com/reel/DZ4ZYbtt9T6/embed/',  name: 'Ginger Chatpata 10PC', price: '₹380', original: '₹430' },
    { src: 'https://www.instagram.com/reel/DZmbVMtt1vL/embed/',  name: 'Maharana Special',   price: '₹150', original: '₹200' },
  ];

  let current = 0;

  const overlay   = document.getElementById('fs-overlay');
  let   fsIframe  = document.getElementById('fs-iframe'); // let — replaced on each nav
  const fsCounter = document.getElementById('fs-counter');
  const fsName    = document.getElementById('fs-product-name');
  const fsPrice   = document.getElementById('fs-price-current');
  const fsOrig    = document.getElementById('fs-price-original');
  const fsHint    = document.getElementById('fs-swipe-hint');
  const spinner   = document.getElementById('fs-spinner');

  function openFullscreen(index) {
    current = index;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    animating = false;
    resetClip();                 // clear any leftover slide transform
    if (fsHint) fsHint.classList.remove('hide');   // show the swipe hint again
    loadReel(current, true); // autoplay on first open too
  }

  function closeFullscreen() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    animating = false;
    resetClip();
    fsIframe.src = '';
  }

  /* Build a brand-new <iframe> element and return it.
     Creating a fresh element (not just changing src) lets the browser propagate
     the current user-activation into the iframe, which is what unlocks autoplay. */
  function makeFreshIframe() {
    const f = document.createElement('iframe');
    f.id = 'fs-iframe';
    f.setAttribute('scrolling', 'no');
    f.setAttribute('allowtransparency', 'true');
    f.setAttribute('allow', 'autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share');
    f.style.opacity = '0';
    return f;
  }

  function loadReel(index, autoplay = false) {
    const reel = REELS[index];
    const clip = document.getElementById('fs-clip');

    spinner.classList.add('show');

    if (autoplay) {
      /* AUTOPLAY PATH — replace the iframe element so the browser
         propagates user-activation from the gesture into the fresh iframe */
      const frame = makeFreshIframe();

      frame.onload = () => {
        spinner.classList.remove('show');
        frame.style.opacity = '1';
      };

      /* captioned/?cr=1&v=14 mirrors what Instagram's own embed.js generates.
         The cr=1 flag is the strongest known signal for their player to autoplay. */
      const base = reel.src.replace('/embed/', '/embed/captioned/');
      frame.src = base + '?cr=1&v=14&autoplay=1';
      clip.replaceChild(frame, fsIframe);
      fsIframe = frame; // keep reference up to date

    } else {
      /* FIRST-OPEN PATH — reuse existing iframe, no autoplay needed */
      fsIframe.style.opacity = '0';
      fsIframe.onload = () => {
        spinner.classList.remove('show');
        fsIframe.style.opacity = '1';
      };
      fsIframe.src = reel.src;
    }

    fsName.textContent  = reel.name;
    fsPrice.textContent = reel.price;
    fsOrig.textContent  = reel.original;
    fsCounter.textContent = `${index + 1} / ${REELS.length}`;
  }

  function goToReel(index) {
    /* Wrap around: past last → first, before first → last */
    current = ((index % REELS.length) + REELS.length) % REELS.length;
    loadReel(current, true);
  }

  /* ── Keyboard navigation ── */
  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') animateNav(+1);
    if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  animateNav(-1);
    if (e.key === 'Escape') closeFullscreen();
  });

  /* ── Touch swipe (mobile) — the clip follows the finger, then commits ── */
  let touchStartY = 0;
  let touchStartX = 0;
  let touchMoved  = false;
  let swiping     = false;

  overlay.addEventListener('touchstart', e => {
    if (animating) return;
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchMoved  = false;
    swiping     = true;
  }, { passive: true });

  overlay.addEventListener('touchmove', e => {
    if (!swiping) return;
    const dy = e.touches[0].clientY - touchStartY;
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    // bail out of mostly-horizontal gestures so they don't drag the reel
    if (!touchMoved && dx > Math.abs(dy)) { swiping = false; return; }
    touchMoved = true;
    hideHint();
    followDrag(dy);
  }, { passive: true });

  overlay.addEventListener('touchend', e => {
    if (!swiping) return;
    swiping = false;
    if (!touchMoved) { resetClip(); return; }
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
    releaseDrag(dy, dx);
  }, { passive: true });

  /* ── Mouse drag + trackpad wheel navigation ── */
  const fsClip   = document.getElementById('fs-clip');
  const dragTop  = document.getElementById('fs-drag-top');
  const dragBot  = document.getElementById('fs-drag-bottom');

  let mouseStartY = 0;
  let mouseStartX = 0;
  let isDragging  = false;
  let dragMoved   = false;

  const DRAG_THRESHOLD = 60;
  const DEAD_ZONE      = 5;

  /* Clear all inline transition styles back to the CSS defaults */
  function resetClip() {
    fsClip.style.transition = '';
    fsClip.style.transform  = '';
    fsClip.style.opacity    = '';
  }

  /* Hide the "swipe to switch" hint once the user has swiped */
  function hideHint() { if (fsHint) fsHint.classList.add('hide'); }

  /* Snap the clip back to centre when a swipe doesn't pass the threshold */
  function snapClipBack() {
    fsClip.style.transition = 'transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.3s';
    fsClip.style.transform  = 'translateY(0)';
    fsClip.style.opacity    = '1';
    setTimeout(resetClip, 320);
  }

  /* Live follow — the clip tracks the finger/drag before release */
  function followDrag(dy) {
    const clamped = Math.max(-200, Math.min(200, dy));
    fsClip.style.transition = 'none';
    fsClip.style.transform  = `translateY(${clamped}px)`;
    fsClip.style.opacity    = String(1 - Math.min(Math.abs(dy) / 220, 1) * 0.3);
  }

  /* On release: commit the reel switch (with slide animation) or snap back */
  function releaseDrag(dy, dx) {
    if (Math.abs(dy) >= DRAG_THRESHOLD && Math.abs(dy) > dx * 1.2) {
      animateNav(dy < 0 ? +1 : -1);   // swipe up → next, swipe down → prev
    } else {
      snapClipBack();
    }
  }

  /* ── Reels-style slide transition ──────────────────────────────────────
     The current clip slides out the way you swiped, the next reel is placed
     just off the opposite edge, then slides into the centre. dir: +1 = next
     (slide up), -1 = prev (slide down). goToReel() wraps → endless loop.     */
  let animating = false;
  const SLIDE_MS = 320;
  const SLIDE = `transform ${SLIDE_MS}ms cubic-bezier(0.22,0.61,0.36,1), opacity ${SLIDE_MS}ms`;

  function animateNav(dir) {
    if (animating) return;
    animating = true;
    hideHint();
    const outY = dir > 0 ? '-115%' : '115%';   // current exits in the swipe direction
    const inY  = dir > 0 ?  '115%' : '-115%';   // next enters from the opposite edge

    // 1) slide the current reel out the way you swiped
    fsClip.style.transition = SLIDE;
    fsClip.style.transform  = `translateY(${outY})`;
    fsClip.style.opacity    = '0.5';

    setTimeout(() => {
      // 2) drop the new reel just off the opposite edge (no animation) & load it
      fsClip.style.transition = 'none';
      fsClip.style.transform  = `translateY(${inY})`;
      fsClip.style.opacity    = '1';
      goToReel(current + dir);                  // wraps around → endless loop
      void fsClip.offsetHeight;                 // force reflow so the jump is committed

      // 3) re-enable the transition → slides from the opposite edge into centre
      fsClip.style.transition = SLIDE;
      fsClip.style.transform  = 'translateY(0)';
    }, SLIDE_MS);

    // Reset on an independent timer (not transitionend / rAF) so an interrupted or
    // no-op transition can never leave `animating` stuck true and block swipes.
    setTimeout(() => { resetClip(); animating = false; }, SLIDE_MS * 2 + 60);
  }

  function startDrag(e) {
    if (animating) return;
    mouseStartY = e.clientY;
    mouseStartX = e.clientX;
    isDragging  = true;
    dragMoved   = false;
    document.body.style.userSelect = 'none';
  }

  /* Top and bottom strips handle drag; centre is uncovered so the iframe's
     play button receives clicks directly — no overlay, no double-tap needed. */
  dragTop.addEventListener('mousedown', startDrag);
  dragBot.addEventListener('mousedown', startDrag);

  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dy = e.clientY - mouseStartY;
    if (Math.abs(dy) < DEAD_ZONE) return;
    dragMoved = true;
    hideHint();
    followDrag(dy);
  });

  document.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    if (!dragMoved) { resetClip(); return; }
    releaseDrag(e.clientY - mouseStartY, Math.abs(e.clientX - mouseStartX));
  });

  document.addEventListener('mouseleave', () => {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    snapClipBack();
  });

  /* ── Scroll wheel / two-finger trackpad swipe ──
     wheel events bubble OUT of iframes so this works from inside the video too */
  let lastWheel = 0;
  overlay.addEventListener('wheel', e => {
    e.preventDefault();
    if (animating) return;
    const now = Date.now();
    if (now - lastWheel < 700) return; // debounce rapid scroll
    lastWheel = now;
    if      (e.deltaY >  20) animateNav(+1);
    else if (e.deltaY < -20) animateNav(-1);
  }, { passive: false });

  /* ── Carousel scroll ── */
  function scrollReels(dir) {
    document.getElementById('track').scrollBy({ left: dir * (300 + 16) * 2, behavior: 'smooth' });
  }
</script>

</body>
</html>
