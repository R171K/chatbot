<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WaoSim Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;

  background: linear-gradient(-45deg,#020617,#0f172a,#1e293b,#1e3a8a);
  background-size: 300% 300%;
  animation: gradientBG 18s ease infinite;
}

@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* HEADER */
.chat-header {
  background: rgba(30,41,59,0.8);
  backdrop-filter: blur(10px);
  color:white;
  padding:14px;
  font-size:16px;
  font-weight:600;
}

/* CHAT */
.chat-container {
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.chat-box {
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* MESSAGE WRAPPER (UNCHANGED STRUCTURE = KEY) */
.message-wrapper {
  display:flex;
  flex-direction:column;
  margin-bottom:10px;
}

/* MESSAGE (RESTORED FROM WORKING VERSION) */
.message {
  max-width:60%;
  padding:12px 14px;
  border-radius:12px;
  line-height:1.5;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

/* FIX MARKDOWN SPACING */
.bot p { margin:6px 0; }
.bot ul { margin:6px 0; padding-left:18px; }
.bot li { margin-bottom:4px; }

/* USER */
.user-wrapper { align-items:flex-end; }

.user {
  background:#2563eb;
  color:white;
}

/* BOT */
.bot-wrapper { align-items:flex-start; }

.bot {
  background:#1e293b;
  color:#e2e8f0;
}

/* AVATAR (SAFE ADD) */
.avatar {
  font-size:13px;
  margin-bottom:4px;
}

/* TIMESTAMP (SAFE ADD) */
.timestamp {
  font-size:11px;
  color:#94a3b8;
  margin-top:4px;
}

/* INPUT */
.input-container {
  display:flex;
  padding:12px;
  background:#1e293b;
}

textarea {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  resize:none;
  outline:none;
  background:#0f172a;
  color:white;
}

button {
  margin-left:10px;
  padding:10px 16px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-header">🌍 WaoSim Assistant</div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <textarea id="userInput" rows="1" placeholder="Ask about eSIM..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

/* CLEAN TEXT */
function cleanText(text){
  return text
    .replace(/\r/g,"")
    .replace(/^[A-Z][^\n]*\?\s*$/gm,"")
    .replace(/^(What|When|Can|How|Why|Is|Do)[^\n]*\?\s*$/gim,"")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

/* TIME */
function getTime(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

/* MESSAGE (CLEAN STRUCTURE) */
function createMessage(content,type){
  return `
  <div class="message-wrapper ${type}-wrapper">
    <div class="avatar">${type==="user"?"🧑":"🤖"}</div>
    <div class="message ${type}">
      ${content}
    </div>
    <div class="timestamp">${getTime()}</div>
  </div>`;
}

/* AUTO SCROLL (SIMPLE + RELIABLE) */
function scrollToBottom(){
  const box = document.getElementById("chatBox");
  box.scrollTop = box.scrollHeight;
}

/* SEND */
async function sendMessage(){
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if(!msg) return;

  const chatBox = document.getElementById("chatBox");

  chatBox.innerHTML += createMessage(msg,"user");
  input.value="";
  scrollToBottom();

  const typingId = "t-"+Date.now();
  chatBox.innerHTML += `
    <div id="${typingId}" class="message-wrapper bot-wrapper">
      <div class="avatar">🤖</div>
      <div class="message bot">Typing...</div>
    </div>`;
  scrollToBottom();

  try{
    const res=await fetch(webhookURL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:msg})
    });

    const data=await res.json();
    document.getElementById(typingId).remove();

    const reply = cleanText(data.output||data.text||"⚠️ Error");

    chatBox.innerHTML += createMessage(marked.parse(reply),"bot");
    scrollToBottom();

  }catch{
    document.getElementById(typingId).remove();
    chatBox.innerHTML += createMessage("⚠️ Connection issue","bot");
    scrollToBottom();
  }
}

/* ENTER */
document.getElementById("userInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
