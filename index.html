<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WaoSim Support Chat</title>

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #1e293b;
      color: white;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      max-width: 60%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap; /* preserve line breaks */
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #1e293b;
      color: #e2e8f0;
      margin-right: auto;
    }

    .input-container {
      display: flex;
      padding: 15px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      background: #22c55e;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .bot strong {
      font-weight: bold;
      color: #facc15;
    }
  </style>
</head>

<body>

  <div class="chat-header">
    🌍 WaoSim Support Assistant
  </div>

  <div class="chat-container">
    <div id="chatBox" class="chat-box"></div>

    <div class="input-container">
      <input id="userInput" placeholder="Ask about eSIM, plans, activation..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

// ✅ CLEAN TEXT ONLY (no bullet manipulation)
function cleanText(text) {
  return text
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// ✅ BULLETPROOF AUTO SCROLL (FINAL FIX)
function scrollToBottom() {
  const chatBox = document.getElementById("chatBox");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: "smooth"
      });
    });
  });
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");

  const message = input.value.trim();
  if (!message) return;

  // ✅ USER MESSAGE
  chatBox.innerHTML += `<div class="message user">${message}</div>`;
  input.value = "";
  scrollToBottom();

  // ✅ TYPING INDICATOR
  const typingId = "typing-" + Date.now();
  chatBox.innerHTML += `<div id="${typingId}" class="message bot">Typing...</div>`;
  scrollToBottom();

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    const response = await fetch(webhookURL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ chatInput: message }),
      signal: controller.signal
    });

    clearTimeout(timeout);

    const data = await response.json();

    // ❌ REMOVE TYPING
    document.getElementById(typingId).remove();

    const botReply =
      data.output ||
      data.response ||
      data.text ||
      "⚠️ Sorry, I couldn’t find that information.";

    // ✅ CLEAN TEXT
    const cleaned = cleanText(botReply);

    // ✅ RENDER MARKDOWN
    const formatted = marked.parse(cleaned);

    // ✅ BOT MESSAGE
    chatBox.innerHTML += `<div class="message bot">${formatted}</div>`;

    // 🔥 FINAL SCROLL FIX
    scrollToBottom();

  } catch (error) {
    document.getElementById(typingId).remove();

    chatBox.innerHTML += `
      <div class="message bot">
        ⚠️ Connection issue. Please try again.
      </div>
    `;

    scrollToBottom();
  }
}

// ✅ ENTER KEY SUPPORT
document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
