<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WaoSim Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #1e3a8a);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.chat-header {
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
  color: white;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.toggle-btn {
  cursor: pointer;
  font-size: 14px;
}

.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  scroll-behavior: smooth;
}

/* MESSAGE WRAPPER */
.message-wrapper {
  display: flex;
  flex-direction: column;
  margin-bottom: 12px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(5px);}
  to {opacity: 1;}
}

/* MESSAGE */
.message {
  max-width: fit-content;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  backdrop-filter: blur(12px);
}

.user-wrapper { align-items: flex-end; }

.user {
  background: rgba(37, 99, 235, 0.9);
  color: white;
  position: relative;
}

.user::after {
  content: "";
  position: absolute;
  right: -6px;
  bottom: 6px;
  border: 6px solid transparent;
  border-left-color: rgba(37, 99, 235, 0.9);
}

.bot-wrapper { align-items: flex-start; }

.bot {
  background: rgba(30, 41, 59, 0.9);
  color: #e2e8f0;
  position: relative;
}

.bot::after {
  content: "";
  position: absolute;
  left: -6px;
  bottom: 6px;
  border: 6px solid transparent;
  border-right-color: rgba(30, 41, 59, 0.9);
}

.avatar {
  font-size: 18px;
  margin-bottom: 4px;
}

.timestamp {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 3px;
}

/* FIX SPACING */
.bot p {
  margin: 4px 0;
}

/* INPUT */
.input-container {
  display: flex;
  padding: 12px;
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 12px 18px;
  border: none;
  background: #22c55e;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* TYPING */
.typing-dots {
  display: flex;
  gap: 4px;
}
.typing-dots span {
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  animation: blink 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% {opacity: 0;}
  40% {opacity: 1;}
}
</style>
</head>

<body>

<div class="chat-header">
  🌍 WaoSim Assistant
  <div class="toggle-btn" onclick="toggleMode()">🌗 Mode</div>
</div>

<div class="chat-container">
  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <input id="userInput" placeholder="Ask about eSIM, plans, activation..." />
    <button onclick="sendMessage()">Send</button>
    <button onclick="handoff()">Talk to Agent</button>
  </div>
</div>

<script>
const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/17c40753-d877-4e30-9358-76996323449b/chat";

marked.setOptions({
  breaks: true,
  mangle: false,
  headerIds: false
});

/* CLEAN TEXT */
function cleanText(text) {
  return text
    .replace(/\r/g, "")
    .replace(/^[A-Z][^\n]*\?\s*$/gm, "")
    .replace(/^(What|When|Can|How|Why|Is|Do)[^\n]*\?\s*$/gim, "")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/\n\s+\n/g, "\n\n")
    .trim();
}

/* TIME */
function getTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* 🔥 SMART SCROLL */
function scrollToBottom(force = false) {
  const box = document.getElementById("chatBox");

  const isNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 100;

  if (force || isNearBottom) {
    box.scrollTop = box.scrollHeight;
  }
}

/* 🔥 OBSERVER (KEY FIX) */
const chatBox = document.getElementById("chatBox");

const observer = new MutationObserver(() => {
  scrollToBottom();
});

observer.observe(chatBox, {
  childList: true,
  subtree: true
});

/* MESSAGE */
function createMessage(content, type) {
  return `
  <div class="message-wrapper ${type}-wrapper">
    <div class="avatar">${type === "user" ? "🧑" : "🤖"}</div>
    <div class="message ${type}">${content}</div>
    <div class="timestamp">${getTime()}</div>
  </div>`;
}

/* TYPING */
function typingBubble(id) {
  return `
  <div id="${id}" class="message-wrapper bot-wrapper">
    <div class="avatar">🤖</div>
    <div class="message bot">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>`;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const box = document.getElementById("chatBox");

  const msg = input.value.trim();
  if (!msg) return;

  box.innerHTML += createMessage(msg, "user");
  input.value = "";
  scrollToBottom(true);

  const id = "t-" + Date.now();
  box.innerHTML += typingBubble(id);
  scrollToBottom(true);

  try {
    const res = await fetch(webhookURL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:msg})
    });

    const data = await res.json();
    document.getElementById(id).remove();

    const reply = cleanText(data.output || data.text || "⚠️ Error");

    box.innerHTML += createMessage(marked.parse(reply), "bot");
    scrollToBottom(true);

  } catch {
    document.getElementById(id).remove();
    box.innerHTML += createMessage("⚠️ Connection issue", "bot");
    scrollToBottom(true);
  }
}

document.getElementById("userInput").addEventListener("keypress", e=>{
  if(e.key==="Enter") sendMessage();
});

function toggleMode() {
  document.body.classList.toggle("light");
}

function handoff() {
  alert("Connecting you to a live agent...");
}
</script>

</body>
</html>
