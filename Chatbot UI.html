<!DOCTYPE html>
<html>
<head>
  <title>Real Estate Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 420px;
      height: 620px;
      background: #1e293b;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .chat-header {
      background: #3b82f6;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.4;
      white-space: pre-line;
    }

    .user {
      background: #3b82f6;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #334155;
      color: #e2e8f0;
      align-self: flex-start;
    }

    .input-container {
      display: flex;
      border-top: 1px solid #475569;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>

<div class="chat-container">
  <div class="chat-header">🏠 Real Estate Assistant</div>

  <div id="chatBox" class="chat-box"></div>

  <div class="input-container">
    <input id="userInput" placeholder="Ask about properties..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const webhookURL = "https://arbitrary-enjoyment-ounce.ngrok-free.dev/webhook/f7f00fc1-2569-4e67-979d-a1e2fbf9a26e/chat";

  // ✅ Create persistent session ID
  let sessionId = localStorage.getItem("sessionId");
  if (!sessionId) {
    sessionId = "user-" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("sessionId", sessionId);
  }

  function addMessage(text, sender) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const button = document.getElementById("sendBtn");

    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    button.disabled = true;

    try {
      const response = await fetch(webhookURL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chatInput: message,
          sessionId: sessionId   // ✅ IMPORTANT FIX
        })
      });

      const responseText = await response.text();
      let data;

      try {
        data = JSON.parse(responseText);
      } catch {
        data = { output: responseText };
      }

      const reply =
        data.output ||
        data.text ||
        data.response ||
        data.message ||
        "⚠️ No response from chatbot";

      addMessage(reply, "bot");

    } catch (error) {
      addMessage("⚠️ Error: " + error.message, "bot");
      console.error(error);
    }

    button.disabled = false;
  }

  // Enter key support
  document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
